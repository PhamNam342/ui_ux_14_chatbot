  <g id="Content"><rect x="276" y="104" width="1124" height="860" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="276" y="104" width="1124" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="316" cy="139" r="21" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/><text x="352" y="134" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">BS. Trần Thị Hoa</text><text x="352" y="154" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Tim mạch · ● Đang online</text><rect x="1286" y="121" width="78" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/><text x="1325" y="144" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Video</text><rect x="304" y="214" width="562" height="66" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/><text x="324" y="242" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Chào bạn, tôi đã nhận thông tin từ chatbot.</text><text x="324" y="263" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Bạn mô tả thêm tình trạng chóng mặt giúp tôi nhé.</text><rect x="840" y="318" width="532" height="58" rx="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/><text x="860" y="352" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Tôi chóng mặt nhẹ khi đứng lên và hơi đau đầu.</text><rect x="304" y="416" width="620" height="78" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/><text x="324" y="446" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Bạn vui lòng đo huyết áp nếu có thiết bị.</text><text x="324" y="468" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Nếu đau đầu tăng mạnh, hãy báo ngay cho tôi.</text><rect x="304" y="534" width="1068" height="102" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="324" y="564" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Tóm tắt phiên tư vấn</text><rect x="324" y="584" width="980" height="5" rx="2" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1.3"/><rect x="324" y="596" width="980" height="5" rx="2" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1.3"/><rect x="324" y="608" width="705.6" height="5" rx="2" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1.3"/><text x="304" y="804" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Thông tin hội thoại được bảo mật.</text><rect x="304" y="842" width="42" height="48" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/><text x="325" y="865" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">+</text><rect x="362" y="842" width="902" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><text x="375" y="866" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Nhập tin nhắn cho bác sĩ...</text><rect x="1280" y="842" width="84" height="48" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/><text x="1322" y="865" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Gửi</text></g>
