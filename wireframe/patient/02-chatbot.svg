    <circle cx="39" cy="145" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="60" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Dashboard</text><rect x="18" y="177" width="200" height="40" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/><circle cx="39" cy="197" r="9" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.2"/><text x="60" y="202" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Chat tư vấn</text><circle cx="39" cy="249" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="60" y="254" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Tư vấn trực tuyến</text><circle cx="39" cy="301" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="60" y="306" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Đặt lịch khám</text><circle cx="39" cy="353" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="60" y="358" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Bảng giá dịch vụ</text><circle cx="39" cy="405" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="60" y="410" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Hồ sơ bệnh án</text>
