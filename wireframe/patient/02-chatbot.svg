    <text x="1340" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Trần Thị Mai</text><text x="1340" y="48" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">Sẵn sàng</text></g>
  <g id="Content"><text x="276" y="120" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#334155">Chat tư vấn</text><text x="276" y="144" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Khảo sát triệu chứng ban đầu cùng trợ lý MedConsult.</text><rect x="276" y="174" width="1124" height="790" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="276" y="174" width="1124" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="310" cy="206" r="17" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/><text x="340" y="201" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Trợ lý MedConsult</text><text x="340" y="220" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">● Đang hoạt động · Miễn phí</text><rect x="294" y="256" width="560" height="62" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/><text x="314" y="282" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Xin chào, tôi là trợ lý sức khỏe MedConsult.</text><text x="314" y="301" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Hôm nay bạn đang gặp vấn đề gì?</text><rect x="304" y="336" width="154" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="381" y="354" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Sốt / Ớn lạnh</text><rect x="472" y="336" width="154" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="549" y="354" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Đau đầu / Chóng mặt</text><rect x="640" y="336" width="154" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="717" y="354" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Ho / Sổ mũi</text><rect x="304" y="374" width="154" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="381" y="392" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Đau bụng</text><rect x="472" y="374" width="154" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="549" y="392" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Đau ngực / Khó thở</text><rect x="640" y="374" width="154" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="717" y="392" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Vấn đề khác</text><rect x="792" y="438" width="572" height="54" rx="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/><text x="812" y="470" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Tôi đau đầu và hơi chóng mặt từ sáng nay.</text><rect x="294" y="526" width="646" height="72" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/><text x="314" y="554" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Tôi đã ghi nhận. Triệu chứng của bạn ở mức độ nào?</text><text x="314" y="578" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Bạn có thể chọn câu trả lời nhanh bên dưới.</text><rect x="304" y="618" width="78" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="343" y="636" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Nhẹ</text><rect x="396" y="618" width="78" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="435" y="636" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Vừa</text><rect x="488" y="618" width="78" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="527" y="636" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Nặng</text><rect x="294" y="724" width="1088" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/><text x="310" y="750" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Thông tin được mã hóa và chỉ chuyển cho bác sĩ khi bạn đồng ý.</text><rect x="352" y="838" width="920" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><text x="365" y="862" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Ví dụ: Tôi đau đầu từ sáng nay...</text><rect x="1290" y="838" width="74" height="48" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/><text x="1327" y="861" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Gửi</text><rect x="294" y="838" width="42" height="48" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/><text x="315" y="861" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">+</text></g>
</svg>